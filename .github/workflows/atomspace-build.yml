---
name: CogML - AtomSpace Build
on:
  workflow_dispatch:
    inputs:
      cogutil_cache_key:
        description: 'Cache key for cogutil dependency'
        required: false
        type: string
      cache_key_suffix:
        description: 'Cache key suffix for dependency builds'
        required: false
        default: 'default'
        type: string
  workflow_call:
    inputs:
      cogutil_cache_key:
        description: 'Cache key for cogutil dependency'
        required: false
        type: string
      cache_key_suffix:
        description: 'Cache key suffix for dependency builds'
        required: false
        default: 'default'
        type: string

permissions:
  contents: read

env:
  COGML_AUTO_FIX_ENABLED: "true"
  COGML_MAX_FIX_ATTEMPTS: "3"
  COGML_ESCALATION_ENABLED: "true"

jobs:
  atomspace:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      cache_key: ${{ steps.cache_info.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set cache info
        id: cache_info
        run: |
          echo "key=atomspace-${{ runner.os }}-${{ github.sha }}-${{ inputs.cache_key_suffix }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          # Install packages in smaller chunks to prevent timeout
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake
          sudo apt-get install -y -q libboost-all-dev
          sudo apt-get install -y -q guile-3.0-dev cython3
          sudo apt-get install -y -q python3-nose valgrind doxygen

      - name: Restore cogutil cache
        id: restore_cogutil
        uses: actions/cache@v3
        with:
          path: orc-dv/cogutil/build
          key: ${{ inputs.cogutil_cache_key || format('cogutil-{0}-{1}-{2}', runner.os, github.sha, inputs.cache_key_suffix) }}
          restore-keys: |
            cogutil-${{ runner.os }}-${{ github.sha }}-
            cogutil-${{ runner.os }}-
            cogutil-

      - name: Install cogutil
        run: |
          # Check if cogutil build exists from cache, if not build from source
          if [ -d "orc-dv/cogutil/build" ] && [ "$(ls -A orc-dv/cogutil/build 2>/dev/null)" ]; then
            echo "✅ Using cached cogutil build"
            cd orc-dv/cogutil/build
            sudo make install
            sudo ldconfig
          else
            echo "🔨 Cache not available, building cogutil from source"
            cd orc-dv/cogutil
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)
            sudo make install
            sudo ldconfig
            echo "✅ Cogutil built and installed from source"
          fi

      - name: Build AtomSpace with Self-Healing
        run: |
          cd orc-as/atomspace
          
          echo "🔧 Preparing AtomSpace build environment..."
          # Create missing lib directory if it doesn't exist
          if [ ! -d "lib" ]; then
            mkdir -p lib
            echo "# Empty lib directory for build compatibility" > lib/CMakeLists.txt
            echo "📁 Created missing lib directory"
          fi
          
          mkdir -p build && cd build
          echo "📋 Build environment information:"
          echo "Working directory: $(pwd)"
          echo "CMake version: $(cmake --version | head -1)"
          echo "GCC version: $(gcc --version | head -1)"
          
          echo "🔍 Checking for installed dependencies:"
          pkg-config --exists cogutil && echo "✅ cogutil found" || echo "❌ cogutil not found"
          dpkg -l | grep libboost-dev > /dev/null && echo "✅ boost dev found" || echo "❌ boost dev not found"

          # First attempt - try normal build
          echo "🔨 Starting AtomSpace build (attempt 1)..."
          if cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON && make -j$(nproc); then
            echo "✅ AtomSpace build successful on first try!"
          else
            echo "❌ AtomSpace build failed, activating self-healing..."

            # Check if auto-fix is enabled and available
            if [ "$COGML_AUTO_FIX_ENABLED" = "true" ] && [ -f "../../scripts/auto_fix.py" ]; then
              echo "🤖 Running self-healing auto-fix system..."
              cd ../../..

              python3 scripts/auto_fix.py \
                --build-cmd bash -c "cd orc-as/atomspace/build && make -j$(nproc)" \
                --max-attempts $COGML_MAX_FIX_ATTEMPTS \
                --repo-root .

              # Check if fix was successful
              if [ $? -eq 0 ]; then
                echo "✅ Self-healing resolved the build issues!"
              else
                echo "🚨 Self-healing could not resolve issues, manual intervention required"
                echo "📋 CMake error log:"
                cat orc-as/atomspace/build/CMakeFiles/CMakeError.log || true
                echo "📋 Make error output:"
                tail -n 100 orc-as/atomspace/build/CMakeFiles/CMakeOutput.log || true
                exit 1
              fi
            else
              echo "⚠️  Self-healing disabled or unavailable, failing build"
              echo "📋 Available files in repo root:"
              ls -la scripts/ || echo "No scripts directory found"
              echo "📋 CMake configuration output:"
              cat CMakeFiles/CMakeError.log || echo "No CMake error log found"
              exit 1
            fi
          fi

      - name: Test AtomSpace
        run: |
          cd orc-as/atomspace/build
          make test || true

      - name: Install AtomSpace
        run: |
          cd orc-as/atomspace/build
          sudo make install
          sudo ldconfig

      - name: Cache atomspace build
        uses: actions/cache@v3
        with:
          path: orc-as/atomspace/build
          key: ${{ steps.cache_info.outputs.key }}

      - name: Create build artifacts summary
        run: |
          echo "## AtomSpace Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Key**: \`${{ steps.cache_info.outputs.key }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Path**: \`orc-as/atomspace/build\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependencies**: cogutil (\`${{ inputs.cogutil_cache_key }}\`)" >> $GITHUB_STEP_SUMMARY
          ls -la orc-as/atomspace/build/ >> $GITHUB_STEP_SUMMARY || true